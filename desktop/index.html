<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Desktop App — APS Open</title>

    <link rel="icon" href="/desktop/AppIcon.png">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #1e3a5f 0%, transparent 45%),
                linear-gradient(135deg, #0f172a, #111827);
            color: #fff;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            width: min(560px, 100%);
            padding: 42px;
            text-align: center;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(18px);
        }

        .app-icon {
            width: 96px;
            height: 96px;
            margin: 0 auto 22px;
            border-radius: 22px;
            object-fit: contain;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 34px;
            font-weight: 800;
        }

        .subtitle {
            margin: 0 auto 30px;
            color: #cbd5e1;
            font-size: 17px;
            line-height: 1.6;
        }

        .install-button {
            width: 100%;
            border: 0;
            border-radius: 12px;
            padding: 15px 22px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .install-button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .install-button:active {
            transform: translateY(0);
        }

        .status {
            min-height: 22px;
            margin-top: 14px;
            color: #93c5fd;
            font-size: 14px;
        }

        .steps {
            margin-top: 30px;
            padding: 22px;
            text-align: left;
            background: rgba(0, 0, 0, 0.18);
            border-radius: 16px;
        }

        .steps h2 {
            margin: 0 0 15px;
            font-size: 17px;
        }

        .steps ol {
            margin: 0;
            padding-left: 22px;
            color: #cbd5e1;
            line-height: 1.8;
        }

        .note {
            margin-top: 22px;
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.5;
        }

        @media (max-width: 500px) {
            .card {
                padding: 30px 22px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <main class="card">

        <img
            class="app-icon"
            src="/desktop/AppIcon.png"
            alt="APS Open"
        >

        <h1>Desktop App</h1>

        <p class="subtitle">
            Install APS Open on your Mac using the official installer.
        </p>

        <button class="install-button" id="installButton">
            Copy Installation Command
        </button>

        <div class="status" id="status"></div>

        <section class="steps">
            <h2>How to install</h2>

            <ol>
                <li>Click <strong>Copy Installation Command</strong>.</li>
                <li>Open <strong>Terminal</strong> on your Mac.</li>
                <li>Paste the command and press <strong>Return</strong>.</li>
                <li>Follow the installer instructions.</li>
            </ol>
        </section>

        <p class="note">
            This installer is intended for macOS.
        </p>

    </main>

    <script>
        const command =
            'f=$(mktemp); curl -fsSL https://raw.githubusercontent.com/apsopen/tiles/install.sh -o "$f" && chmod +x "$f" && "$f"; r=$?; rm -f "$f"; exit $r';

        const button = document.getElementById("installButton");
        const status = document.getElementById("status");

        button.addEventListener("click", async () => {
            try {
                await navigator.clipboard.writeText(command);

                button.textContent = "Copied!";
                status.textContent =
                    "Command copied. Open Terminal and paste it.";

                setTimeout(() => {
                    button.textContent = "Copy Installation Command";
                    status.textContent = "";
                }, 3000);

            } catch {
                status.textContent =
                    "Copy failed. Please use a browser that supports clipboard access.";
            }
        });
    </script>

</body>
</html>
